services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: opeolluwa
      MYSQL_DATABASE: yii2basic
      MYSQL_USER: opeolluwa
      MYSQL_PASSWORD: opeolluwa
    ports:
      - '3309:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "opeolluwa", "-popeolluwa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: opeolluwa
      PMA_PASSWORD: opeolluwa
    ports:
      - '8050:80'

volumes:
  db_data:
